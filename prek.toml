# `prek install` sets up both kinds of hook: the checks on each commit, and the commit message check.
default_install_hook_types = ["pre-commit", "commit-msg"]
default_stages = ["pre-commit"]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  # Fixtures are hand-written to exact bytes; one has no final newline on purpose.
  { id = "end-of-file-fixer", exclude = "^test/fixtures/.*\\.mmd$" },
  { id = "trailing-whitespace" },
  # tsconfig.json is JSON with comments, which tsc reads and this check does not.
  { id = "check-json", exclude = "(^|/)tsconfig\\.json$" },
  { id = "check-merge-conflict" },
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "eslint",
    name = "ESLint",
    language = "system",
    entry = "npx --no-install eslint",
    files = "\\.(?:js|mjs)$",
  },
  # About a second for the whole suite, so every commit runs it rather than any one file's tests.
  {
    id = "tests",
    name = "npm test",
    language = "system",
    entry = "npm test",
    pass_filenames = false,
    files = "\\.(?:js|mjs|mmd|md)$",
  },
  # The commit message's subject: conventional, at most 72 characters (checks/commit-subject.mjs).
  {
    id = "commit-subject",
    name = "commit subject",
    language = "system",
    entry = "node checks/commit-subject.mjs",
    stages = ["commit-msg"],
  },
]
