<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>merma</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>merma</h1>
    <div class="paths"><span class="path" id="path"></span><span class="path host" id="host"></span></div>
    <div class="right"><span class="status" id="status">loading…</span><span class="toast" id="toast"></span></div>
  </header>
  <div id="error"></div>
  <div id="notice" role="status"></div>
  <div id="diagram">
    <div id="stage"></div>
    <div id="menu" role="menu" data-overlay>
      <button id="menu-add" role="menuitem" title="Add a new node with an edge from this one">Add connected node</button>
      <button id="menu-connect" role="menuitem" title="Then click the node to draw an edge to">Connect to…</button>
      <button id="menu-rename" role="menuitem" title="Change this node's label">Rename</button>
    </div>
    <input id="rename" type="text" aria-label="Node label" title="Enter saves, Escape cancels" data-overlay>
  </div>
  <footer>
    <button id="copy-svg" disabled title="Copy the diagram's SVG markup to the clipboard">Copy SVG</button>
    <button id="download-svg" disabled title="Save the diagram as an .svg file">Download SVG</button>
    <button id="reset-view" disabled title="Fit the diagram to the window (or double-click empty space)">Reset view</button>
    <span class="hint" id="hint">Scroll to zoom, drag to move</span>
  </footer>
  <script type="module" src="/main.mjs"></script>
</body>
</html>
